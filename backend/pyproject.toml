[project]
name = "backend"
version = "0.1.0"
description = "FireWallet - Proactive Financial Firewall & AI Coach (Trinity Architecture)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../tests", "tests", "../Tests", "Tests"]
python_files = ["test_*.py"]
pythonpath = [".", "app"]
markers = [
    "unit: fast unit tests for business rules and data models",
    "api: API router and endpoint tests",
    "integration: tests requiring docker containers or external testcontainers",
]

